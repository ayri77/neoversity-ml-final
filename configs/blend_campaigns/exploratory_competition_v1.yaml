schema_version: blend_campaign_v1
campaign_id: exploratory_competition_v1
candidate_root: artifacts/prediction_candidates
blend_root: artifacts/prediction_blends
submission_root: artifacts/candidate_submissions

# Replace every TODO value with one exact immutable prediction_candidate_v1 ID.
# A is the historical AutoGluon LightGBMPrep_r31 v3 anchor associated with the
# external Public 0.9112 benchmark. That score is context only and is never a
# campaign ranking or optimization input.
candidates:
  A: TODO_EXACT_CANDIDATE_ID_A
  B: TODO_EXACT_CANDIDATE_ID_B
  C: TODO_EXACT_CANDIDATE_ID_C
  D: TODO_EXACT_CANDIDATE_ID_D
  E: TODO_EXACT_CANDIDATE_ID_E
  F: TODO_EXACT_CANDIDATE_ID_F
  G: TODO_EXACT_CANDIDATE_ID_G
  H: TODO_EXACT_CANDIDATE_ID_H
  I: TODO_EXACT_CANDIDATE_ID_I

experiments:
  - experiment_id: pair_a_b
    candidates: [A, B]
    strategy: optimized
    optimizer: native
    folds: 5
    repeats: 2
    seed: 42
    max_active_models: 2
    manual_weights: {}
    native_search: &native_search
      pairwise_grid_step: 0.1
      dirichlet_draws: 32
    optuna: &optuna
      trials: 200
      timeout_seconds: null
      seed: 42
    threshold_policy: &threshold_policy
      minimum: 0.05
      maximum: 0.30
      step: 0.001
      maximizer_absolute_tolerance: 1.0e-12
      constant_probability_fallback: 0.5
    exploratory: true

  - experiment_id: pair_a_c
    candidates: [A, C]
    strategy: optimized
    optimizer: native
    folds: 5
    repeats: 2
    seed: 42
    max_active_models: 2
    manual_weights: {}
    native_search: *native_search
    optuna: *optuna
    threshold_policy: *threshold_policy
    exploratory: true

