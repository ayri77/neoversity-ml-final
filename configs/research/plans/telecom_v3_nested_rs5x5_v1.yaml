outer_evaluation:
  splitter: stratified_kfold
  n_splits: 5
  shuffle: true
  repeat_seeds: [0, 17, 42, 73, 101]

threshold_selection:
  splitter: stratified_kfold
  n_splits: 5
  shuffle: true
  random_state: 314159

threshold_policy:
  id: grid_balanced_accuracy_v1
  metric: balanced_accuracy
  minimum: 0.010
  maximum: 0.990
  step: 0.001
  comparison: greater_than_or_equal
  maximizer_absolute_tolerance: 1.0e-12
  tie_break: median_maximizer_lower_on_even
  constant_probability_fallback: 0.500

metrics:
  primary: balanced_accuracy
  secondary:
    - sensitivity
    - specificity
    - roc_auc
    - average_precision
    - brier_score
  diagnostic:
    - tn
    - fp
    - fn
    - tp
    - predicted_positive_rate
    - selected_threshold

aggregation:
  repeat_method: pooled_predictions
  aggregate_unit: repeat
  standard_deviation: sample
  fold_standard_deviation: descriptive_only
  confidence_interval: none
