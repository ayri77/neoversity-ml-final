# Example Blend Evaluation v1 config.
# Replace component run_dir values with completed compatible Experiment Core v2
# artifact directories. Paths are config-driven and must not be hard-coded in modules.
schema_version: 1
experiment:
  id: lightgbm_xgboost_blend_v1
  name: LightGBM + XGBoost Blend
components:
  lightgbm:
    role: lightgbm
    adapter_id: manual_lightgbm_te_v1_compat
    run_dir: artifacts/research_v2/telecom_v3_development_r2x5_t3_v1_7648a8fc1f19/manual_v3_pipeline_v1_compat__manual_lightgbm_te_v1_compat/20260729T070702417916Z_38bbefe2
  xgboost:
    role: xgboost
    adapter_id: xgboost_numeric_v1
    run_dir: artifacts/research_v2/telecom_v3_development_r2x5_t3_v1_7648a8fc1f19/manual_v3_pipeline_v1_compat__xgboost_numeric_v1/20260729T191059296125Z_55c26d5e
blend:
  method: linear_probability_mean
  lightgbm_weight_grid:
    minimum: 0.0
    maximum: 1.0
    step: 0.025
  weight_selection:
    metric: balanced_accuracy
    maximizer_absolute_tolerance: 1.0e-12
    prefer_closest_to: 0.5
    secondary_tie_break: lower_lightgbm_weight
  cross_fitting:
    protocol: leave_one_outer_fold_out_within_repeat
    forbid_pooled_oof_fallback: true
deployment_parameters:
  weight_aggregation: median
  threshold_aggregation: median
  sensitivity_weight_deltas: [0.05, 0.10]
artifacts:
  root: artifacts/blend_evaluations
  evaluation_id: lightgbm_xgboost_blend_v1
