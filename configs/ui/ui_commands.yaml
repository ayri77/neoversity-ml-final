schema_version: 1
approved_public_clis:
  - scripts/run_research_v2.py
  - scripts/run_research_evaluation.py
  - scripts/compare_research_v2.py
  - scripts/compare_research_v2_datasets.py
  - scripts/run_blend_evaluation_v1.py
  - scripts/run_prediction_blend.py
  - scripts/generate_candidate_submission.py
  - scripts/import_autogluon_prediction_candidates.py
  - scripts/sync_mlflow.py
  - scripts/run_deployment_v1.py
  - scripts/run_optuna_search.py
commands:
  - id: experiment_core_v2
    title: Experiment Core v2
    description: Validate or run the approved train-only Experiment Core v2 CLI.
    category: Research
    argv_prefix: ["$PYTHON", "-u", "scripts/run_research_v2.py"]
    allowed_config_globs:
      - "configs/research_v2/*.yaml"
      - "artifacts/ui_configs/*.yaml"
      - "artifacts/ui_configs/*.yml"
      - "artifacts/ui_configs/*.json"
      - "artifacts/optuna_exports/*.yaml"
    allowed_input_roots: ["configs/research_v2", "artifacts/ui_configs", "artifacts/optuna_exports"]
    allowed_output_roots: []
    result_reader_id: research_v2
    artifact_url: null
    environment: []
    actions:
      - id: validate
        title: Validate
        description: Run the public Experiment Core v2 preflight without fitting.
        argv: ["--config", "{config}", "--validate-only"]
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/research_v2", "artifacts/ui_configs", "artifacts/optuna_exports"]
            must_exist: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ["Research v2 validation successful."]
        failure_markers: ["Traceback", "Status: failed"]
      - id: run
        title: Run
        description: Start the approved train-only Experiment Core v2 evaluation.
        argv: ["--config", "{config}"]
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/research_v2", "artifacts/ui_configs", "artifacts/optuna_exports"]
            must_exist: true
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ["Status: completed"]
        failure_markers: ["Status: failed", "Traceback"]

  - id: research_v1
    title: Research evaluation v1
    description: Validate or run the approved legacy nested train-only research CLI.
    category: Research
    argv_prefix: ["$PYTHON", "-u", "scripts/run_research_evaluation.py"]
    allowed_config_globs:
      - "configs/research/*.yaml"
      - "artifacts/ui_configs/*.yaml"
      - "artifacts/ui_configs/*.yml"
      - "artifacts/ui_configs/*.json"
    allowed_input_roots: ["configs/research", "artifacts/ui_configs"]
    allowed_output_roots: []
    result_reader_id: research_v1
    environment: []
    artifact_url: null
    actions:
      - id: validate
        title: Validate
        description: Run the public research v1 preflight without fitting.
        argv: ["--config", "{config}", "--validate-only"]
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/research", "artifacts/ui_configs"]
            must_exist: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ["Research validation successful."]
        failure_markers: ["Traceback", "Status: failed"]
      - id: run
        title: Run
        description: Start the approved legacy train-only research evaluation.
        argv: ["--config", "{config}"]
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/research", "artifacts/ui_configs"]
            must_exist: true
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ["Status: completed"]
        failure_markers: ["Status: failed", "Traceback"]

  - id: paired_comparison
    title: Paired Comparison v1
    description: Validate or create an official comparison of two compatible Experiment Core v2 runs.
    category: Analysis
    argv_prefix: ["$PYTHON", "-u", "scripts/compare_research_v2.py"]
    allowed_config_globs: []
    allowed_input_roots: ["artifacts/research_v2"]
    allowed_output_roots: ["artifacts/research_v2_comparisons"]
    result_reader_id: paired_comparison
    artifact_url: null
    environment: []
    actions:
      - id: validate
        title: Validate
        description: Validate both runs and their compatibility without allocating output.
        argv:
          - "--baseline-run-dir"
          - "{baseline_run_dir}"
          - "--candidate-run-dir"
          - "{candidate_run_dir}"
          - "--validate-only"
        placeholders:
          baseline_run_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/research_v2"]
            must_exist: true
          candidate_run_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/research_v2"]
            must_exist: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ["Compatibility: compatible"]
        failure_markers: ["Status: failed", "Traceback"]
      - id: run
        title: Compare
        description: Create a non-authoritative paired-comparison artifact.
        argv:
          - "--baseline-run-dir"
          - "{baseline_run_dir}"
          - "--candidate-run-dir"
          - "{candidate_run_dir}"
          - "--comparison-id"
          - "{comparison_id}"
          - "--output-root"
          - "{output_root}"
        placeholders:
          baseline_run_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/research_v2"]
            must_exist: true
          candidate_run_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/research_v2"]
            must_exist: true
          comparison_id:
            type: string
            role: value
            required: true
          output_root:
            type: path
            role: output
            required: true
            roots: ["artifacts/research_v2_comparisons"]
            must_exist: false
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ["Status: completed"]
        failure_markers: ["Status: failed", "Traceback"]

  - id: dataset_comparison_v1
    title: Dataset Comparison v1
    description: Validate or create an official comparison of two compatible Experiment Core v2 runs across different Dataset Packages.
    category: Analysis
    argv_prefix: ["$PYTHON", "-u", "scripts/compare_research_v2_datasets.py"]
    allowed_config_globs: []
    allowed_input_roots: ["artifacts/research_v2"]
    allowed_output_roots: ["artifacts/research_v2_dataset_comparisons"]
    result_reader_id: dataset_comparison_v1
    artifact_url: null
    environment: []
    actions:
      - id: validate
        title: Validate
        description: Validate both runs and their cross-dataset compatibility without allocating output.
        argv:
          - "--baseline-run-dir"
          - "{baseline_run_dir}"
          - "--candidate-run-dir"
          - "{candidate_run_dir}"
          - "--validate-only"
        placeholders:
          baseline_run_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/research_v2"]
            must_exist: true
          candidate_run_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/research_v2"]
            must_exist: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ["Compatibility: compatible"]
        failure_markers: ["Status: failed", "Traceback"]
      - id: run
        title: Compare
        description: Create a non-authoritative cross-dataset comparison artifact.
        argv:
          - "--baseline-run-dir"
          - "{baseline_run_dir}"
          - "--candidate-run-dir"
          - "{candidate_run_dir}"
          - "--comparison-id"
          - "{comparison_id}"
          - "--output-root"
          - "{output_root}"
        placeholders:
          baseline_run_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/research_v2"]
            must_exist: true
          candidate_run_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/research_v2"]
            must_exist: true
          comparison_id:
            type: string
            role: value
            required: true
          output_root:
            type: path
            role: output
            required: true
            roots: ["artifacts/research_v2_dataset_comparisons"]
            must_exist: false
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ["Status: completed"]
        failure_markers: ["Status: failed", "Traceback"]

  - id: blend_evaluation_v1
    title: Blend Evaluation v1
    description: Validate or run a leakage-safe LightGBM + XGBoost probability blend with second-level cross-fitting.
    category: Analysis
    argv_prefix: ["$PYTHON", "-u", "scripts/run_blend_evaluation_v1.py"]
    allowed_config_globs:
      - "configs/blend_evaluation/*.yaml"
      - "artifacts/ui_configs/*.yaml"
      - "artifacts/ui_configs/*.yml"
    allowed_input_roots:
      - "configs/blend_evaluation"
      - "artifacts/ui_configs"
      - "artifacts/research_v2"
      - "artifacts/blend_evaluations"
      - "artifacts/deployments"
    allowed_output_roots:
      - "artifacts/blend_evaluations"
      - "artifacts/blend_deployment_packages"
      - "artifacts/blend_submissions"
    result_reader_id: blend_evaluation_v1
    artifact_url: null
    environment: []
    actions:
      - id: validate
        title: Validate
        description: Validate config, base artifacts, and compatibility without writing output.
        argv: ["validate", "--config", "{config}"]
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/blend_evaluation", "artifacts/ui_configs"]
            must_exist: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ["Compatibility: compatible"]
        failure_markers: ["Status: failed", "Traceback"]
      - id: run
        title: Run
        description: Run leakage-safe blend evaluation and write artifacts.
        argv:
          - "run"
          - "--config"
          - "{config}"
          - "--evaluation-id"
          - "{evaluation_id}"
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/blend_evaluation", "artifacts/ui_configs"]
            must_exist: true
          evaluation_id:
            type: string
            role: value
            required: true
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ["Status: completed"]
        failure_markers: ["Status: failed", "Traceback"]
      - id: inspect
        title: Inspect
        description: Inspect a completed blend evaluation artifact.
        argv: ["inspect", "--evaluation-dir", "{evaluation_dir}"]
        placeholders:
          evaluation_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/blend_evaluations"]
            must_exist: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ['"ok": true']
        failure_markers: ["Status: failed", "Traceback"]
      - id: prepare_deployment
        title: Prepare deployment
        description: Prepare draft Final Deployment inputs and shared blend threshold evidence.
        argv: ["prepare-deployment", "--evaluation-dir", "{evaluation_dir}"]
        placeholders:
          evaluation_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/blend_evaluations"]
            must_exist: true
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ["Status: completed"]
        failure_markers: ["Status: failed", "Traceback"]

  - id: mlflow_local_index
    title: MLflow local index
    description: Validate or synchronize the optional read-only metadata mirror.
    category: Tracking
    argv_prefix: ["$PYTHON", "-u", "scripts/sync_mlflow.py"]
    allowed_config_globs:
      - "configs/mlflow/*.yaml"
    allowed_input_roots: ["configs/mlflow"]
    allowed_output_roots: []
    result_reader_id: null
    artifact_url: "http://127.0.0.1:5000"
    environment: []
    actions:
      - id: validate
        title: Validate
        description: Validate MLflow local-index configuration without allocating storage.
        argv: ["validate", "--config", "{config}"]
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/mlflow"]
            must_exist: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ['"schema_version": 1']
        failure_markers: ['"error"']
      - id: sync_dry_run
        title: Validate sources
        description: Fully validate configured sources without importing MLflow or allocating storage.
        argv:
          - "sync"
          - "--config"
          - "{config}"
          - "--source-type"
          - "{source_type}"
          - "--dry-run"
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/mlflow"]
            must_exist: true
          source_type:
            type: enum
            role: value
            required: true
            choices: ["research_v2", "autogluon", "all"]
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ['"dry_run": true']
        failure_markers: ['"error"']
      - id: sync
        title: Synchronize
        description: Validate and mirror approved filesystem metadata into the local MLflow index.
        argv:
          - "sync"
          - "--config"
          - "{config}"
          - "--source-type"
          - "{source_type}"
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/mlflow"]
            must_exist: true
          source_type:
            type: enum
            role: value
            required: true
            choices: ["research_v2", "autogluon", "all"]
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ['"has_failures": false']
        failure_markers: ['"error"', '"has_failures": true']
      - id: sync_all
        title: Sync all
        description: >
          Synchronize all configured supported MLflow readers (Experiment Core v2
          and AutoGluon) in one operation. Recovery/audit alternative to per-source sync.
        argv:
          - "sync"
          - "--config"
          - "{config}"
          - "--source-type"
          - "all"
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/mlflow"]
            must_exist: true
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ['"has_failures": false']
        failure_markers: ['"error"', '"has_failures": true']

  - id: final_deployment_v1
    title: Final Deployment v1
    description: Validate, dry-run, inspect, or explicitly unlock the approved deployment CLI.
    category: Deployment
    argv_prefix: ["$PYTHON", "-u", "scripts/run_deployment_v1.py"]
    # Deployment inputs are typed deployment configurations only. The generic
    # mixed-schema artifacts/ui_configs root is intentionally not accepted here,
    # so an Experiment Core training config can no longer reach this operation.
    allowed_config_globs:
      - "configs/deployment/*.yaml"
      - "artifacts/deployment_drafts/*/deployment_config.yaml"
      - "artifacts/blend_deployment_packages/*/deployment_config.draft.yaml"
    allowed_input_roots:
      - "configs/deployment"
      - "artifacts/deployment_drafts"
      - "artifacts/deployment_fixtures"
      - "artifacts/deployments"
      - "artifacts/blend_deployment_packages"
    allowed_output_roots: ["artifacts/deployments"]
    result_reader_id: deployment_v1
    artifact_url: null
    environment: []
    actions:
      - id: validate
        title: Validate
        description: Validate approvals and deployment configuration without competition-test access.
        argv: ["validate", "--config", "{config}"]
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/deployment", "artifacts/deployment_drafts", "artifacts/blend_deployment_packages"]
            must_exist: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ['"ok": true']
        failure_markers: ['"ok": false']
      - id: dry_run
        title: Synthetic dry run
        description: Execute against an approved synthetic fixture and a new output directory.
        argv:
          - "dry-run"
          - "--config"
          - "{config}"
          - "--fixture-dir"
          - "{fixture_dir}"
          - "--output-dir"
          - "{output_dir}"
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/deployment", "artifacts/deployment_drafts", "artifacts/blend_deployment_packages"]
            must_exist: true
          fixture_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/deployment_fixtures"]
            must_exist: true
          output_dir:
            type: path
            role: output
            required: true
            roots: ["artifacts/deployments"]
            must_exist: false
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ['"ok": true']
        failure_markers: ['"ok": false']
      - id: inspect
        title: Inspect
        description: Use the public CLI to inspect a completed or failed deployment.
        argv: ["inspect", "--deployment-dir", "{deployment_dir}"]
        placeholders:
          deployment_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/deployments"]
            must_exist: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ['"ok": true']
        failure_markers: ['"ok": false']
      - id: run
        title: Generate submission
        description: >
          Local competition submission generation with explicit acknowledgement.
          Network upload remains disabled. Launch still requires a resolved
          deployment draft with authenticated sample-submission and test-row identity.
          Output uses artifacts/deployments/<deployment_id> with no-overwrite.
        argv:
          - "run"
          - "--config"
          - "{config}"
          - "--allow-competition-test"
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/deployment", "artifacts/deployment_drafts", "artifacts/blend_deployment_packages"]
            must_exist: true
        confirmation: acknowledge
        enabled: true
        competition_test: true
        success_markers: ['"ok": true']
        failure_markers: ['"ok": false']

  - id: optuna_search_v1
    title: Optuna Search v1
    description: >
      Validate, run, resume, inspect, or export train-only Optuna searches.
      Additional trials after a finalized study require a new study, config, and
      output ID. This registry does not expose n_trials extension of a finalized study.
    category: Search
    argv_prefix: ["$PYTHON", "-u", "scripts/run_optuna_search.py"]
    allowed_config_globs:
      - "configs/optuna/*.yaml"
      - "artifacts/ui_configs/*.yaml"
      - "artifacts/ui_configs/*.yml"
      - "artifacts/ui_configs/*.json"
    allowed_input_roots:
      - "configs/optuna"
      - "artifacts/ui_configs"
      - "artifacts/optuna_searches"
    allowed_output_roots:
      - "artifacts/ui_configs"
      - "configs/research_v2"
      - "artifacts/optuna_exports"
    result_reader_id: optuna_search_v1
    artifact_url: null
    environment:
      - name: CHURN_ML_OPTUNA_LIFECYCLE_AUTHORITY_KEY_FILE
        required: false
        sensitive: true
    actions:
      - id: validate
        title: Validate
        description: >
          Validate an Optuna search config and referenced contracts without
          allocation. Does not require the lifecycle authority key environment variable.
        argv: ["validate", "--config", "{config}"]
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/optuna", "artifacts/ui_configs"]
            must_exist: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ['"status": "valid"']
        failure_markers: ['"status": "failed"', "Traceback"]
      - id: authority_init
        title: Initialize authority key
        description: >
          Create a new external lifecycle authority key at an absolute path
          outside the repository. The key path is never displayed or persisted.
        argv: ["authority-init", "--output", "{output}"]
        placeholders:
          output:
            type: path
            role: output
            required: true
            external_absolute: true
            sensitive: true
            must_exist: false
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ['"status": "authority_initialized"']
        failure_markers: ['"status": "failed"', "Traceback"]
      - id: run
        title: New study
        description: >
          Start a new train-only Optuna study from an approved config. Requires
          CHURN_ML_OPTUNA_LIFECYCLE_AUTHORITY_KEY_FILE in the process environment.
          For more trials after finalization, create a new study/config/output ID.
        argv: ["run", "--config", "{config}"]
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/optuna", "artifacts/ui_configs"]
            must_exist: true
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ['"status": "completed"']
        failure_markers: ['"status": "failed"', "Traceback"]
      - id: resume
        title: Resume unfinished study
        description: >
          Resume an unfinished train-only Optuna study using the same public run
          CLI and config. Do not use this to raise n_trials on a finalized study;
          start a new study instead. Requires the lifecycle authority key environment variable.
        argv: ["run", "--config", "{config}"]
        placeholders:
          config:
            type: path
            role: config
            required: true
            roots: ["configs/optuna", "artifacts/ui_configs"]
            must_exist: true
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ['"status": "completed"']
        failure_markers: ['"status": "failed"', "Traceback"]
      - id: inspect
        title: Inspect
        description: >
          Read and validate one immutable completed search report. Requires the
          lifecycle authority key environment variable.
        argv: ["inspect", "--search-dir", "{search_dir}"]
        placeholders:
          search_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/optuna_searches"]
            must_exist: true
            artifact_reader_id: optuna_search_v1
            artifact_statuses: ["completed"]
            allow_manual_advanced: true
        confirmation: none
        enabled: true
        competition_test: false
        success_markers: ['"status": "completed"']
        failure_markers: ['"status": "failed"', "Traceback"]
      - id: export_best
        title: Export best candidate
        description: >
          Copy the fixed best candidate config without overwriting. Requires the
          lifecycle authority key environment variable. Additional trials still
          require a new study rather than extending a finalized report.
        argv: ["export-best", "--search-dir", "{search_dir}", "--output", "{output}"]
        placeholders:
          search_dir:
            type: path
            role: input
            required: true
            roots: ["artifacts/optuna_searches"]
            must_exist: true
            artifact_reader_id: optuna_search_v1
            artifact_statuses: ["completed"]
            allow_manual_advanced: true
          output:
            type: path
            role: output
            required: true
            roots:
              - "artifacts/optuna_exports"
              - "artifacts/ui_configs"
              - "configs/research_v2"
            must_exist: false
            suggested_value_template: "artifacts/optuna_exports/{search_dir.basename}_best.yaml"
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ['"status": "exported"']
        failure_markers: ['"status": "failed"', "Traceback"]

  - id: prediction_blend_v1
    title: Prediction Blend v1
    description: >
      Supporting multi-candidate blend CLI used by Blend Workspace.
      Prefer the Blend page for interactive selection and review.
    category: Blend
    argv_prefix: ["$PYTHON", "-u", "scripts/run_prediction_blend.py"]
    allowed_config_globs:
      - "artifacts/ui_blend_requests/*.json"
    allowed_input_roots:
      - "artifacts/ui_blend_requests"
      - "artifacts/prediction_candidates"
      - "artifacts/prediction_blends"
    allowed_output_roots:
      - "artifacts/prediction_blends"
      - "artifacts/prediction_candidates"
    result_reader_id: prediction_blend_v1
    artifact_url: null
    environment: []
    actions:
      - id: search
        title: Search
        description: Evaluate a blend request without writing immutable artifacts.
        argv: ["search", "--request", "{request}"]
        placeholders:
          request:
            type: path
            role: config
            required: true
            roots: ["artifacts/ui_blend_requests"]
            must_exist: true
        confirmation: confirm
        enabled: true
        competition_test: false
        success_markers: ['"ok": true', '"command": "search"']
        failure_markers: ['"ok": false', "Traceback"]
      - id: materialize
        title: Materialize
